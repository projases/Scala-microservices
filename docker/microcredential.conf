database {
  driver   = "org.postgresql.Driver"
  url      = "jdbc:postgresql://postgres:5432/credential"
  user     = "demo"
  password = "demo"
  migrate  = true
}

server {
  host = "0.0.0.0"
  port = 18085
}

courseService {
  baseUrl = "http://course:18084"
}

retry {
  maxAttempts     = 3
  baseDelayMillis = 200
}

rabbit {
  enabled     = true
  host        = "rabbitmq"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
  exchange    = "microcredential.events"
  routingKey  = "microcredential"
}
