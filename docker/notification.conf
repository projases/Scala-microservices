server {
  host = "0.0.0.0"
  port = 18083
}

userService {
  baseUrl = "http://user:18082"
}

productService {
  baseUrl = "http://productcatalog:18081"
}

retry {
  maxAttempts     = 3
  baseDelayMillis = 200
}

# Connection settings are shared; exchange/queue/routing keys default in AppConfig.
microcredential {
  enabled     = true
  host        = "rabbitmq"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
}

product {
  enabled     = true
  host        = "rabbitmq"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
}
