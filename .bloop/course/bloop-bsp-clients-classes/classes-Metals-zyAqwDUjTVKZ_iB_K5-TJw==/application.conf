database {
  driver   = "org.postgresql.Driver"
  url      = "jdbc:postgresql://localhost:54322/course"
  user     = "course"
  password = "course"
  migrate  = true
}

server {
  host = "0.0.0.0"
  port = 18084
}

userService {
  baseUrl = "http://localhost:18082"
}

microcredentialService {
  baseUrl = "http://localhost:18085"
}

retry {
  maxAttempts     = 3
  baseDelayMillis = 200
}

rabbit {
  enabled     = true
  host        = "localhost"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
  exchange    = "course.events"
  queue       = "course.events.closed"
  routingKey  = "course.closed"
}
