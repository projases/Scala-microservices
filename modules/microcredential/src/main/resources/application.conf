database {
  driver   = "org.postgresql.Driver"
  url      = "jdbc:postgresql://localhost:54323/credential"
  user     = "credential"
  password = "credential"
  migrate  = true
}

server {
  host = "0.0.0.0"
  port = 18085
}

courseService {
  baseUrl = "http://localhost:18084"
}

retry {
  maxAttempts     = 3
  baseDelayMillis = 200
}

rabbit {
  enabled     = true
  host        = "localhost"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
  exchange    = "microcredential.events"
  routingKey  = "microcredential"
}