server {
  host = "0.0.0.0"
  port = 18083
}

userService {
  baseUrl = "http://localhost:18082"
}

productService {
  baseUrl = "http://localhost:18081"
}

retry {
  maxAttempts     = 3
  baseDelayMillis = 200
}

# Per-event-stream RabbitMQ topology. Connection settings are shared; the exchange, queue and
# routing keys have defaults in AppConfig (microcredential.events / product.events).
microcredential {
  enabled     = true
  host        = "localhost"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
}

product {
  enabled     = true
  host        = "localhost"
  port        = 5672
  virtualHost = "/"
  username    = "guest"
  password    = "guest"
}
